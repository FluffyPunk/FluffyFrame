[package]
name = "fluffyframe"
version.workspace = true
edition = "2024"
description = "Unofficial Warframe companion app (FluffyFrame, a Rust port of WFHelper)."
license = "MIT"

[[bin]]
name = "fluffyframe"
path = "src/main.rs"

[workspace]
members = ["crates/wf-api", "crates/fluffyframe-core", "crates/fluffyframe-overlay"]

# The app and fluffyframe-core share one version: core reports it as APP_VERSION
# (User-Agent).
[workspace.package]
version = "0.4.0"

[workspace.dependencies]
wf-api = { path = "crates/wf-api" }
fluffyframe-core = { path = "crates/fluffyframe-core" }
fluffyframe-overlay = { path = "crates/fluffyframe-overlay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
log = { version = "0.4", features = ["std"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
crossbeam-channel = "0.5.17"

[dependencies]
fluffyframe-core.workspace = true
fluffyframe-overlay.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["image", "webp", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = "0.18.0"
anyhow = "1.0.105"
egui = "0.37.0"
# The "check riven" hotkey: a system hotkey on Windows, X11 and macOS…
global-hotkey = "0.7.0"

# …and the desktop portal's global shortcuts on Wayland.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14.3", default-features = false, features = ["global_shortcuts", "async-io"] }
futures-util = { version = "0.3", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
