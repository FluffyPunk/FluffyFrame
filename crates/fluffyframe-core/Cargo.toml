[package]
name = "fluffyframe-core"
version.workspace = true
edition = "2024"
license = "MIT"
description = "FluffyFrame services: game data, inventory, warframe.market, world state, EE.log."

[dependencies]
wf-api.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "json", "gzip", "cookies"] }
lzma-rs = "0.3.0"
directories = "6.0.0"
regex = "1"
aes = "0.9.4"
cbc = { version = "0.2.1", features = ["alloc"] }
notify-rust = "4.19.0"
anyhow = "1.0.105"
tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }

# The game's log lines as it writes them (debug output), not ~10 s later from EE.log.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
