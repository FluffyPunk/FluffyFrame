[package]
name = "wf-api"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Library form of wf-api-rust: reads the Warframe API auth token from the running game and downloads the inventory."

[dependencies]
memchr = "2.8.3"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "json"] }
serde_json = "1.0.154"
sysinfo = "0.40.4"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Diagnostics_Debug"] }
